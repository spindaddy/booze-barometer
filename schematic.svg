<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="960" height="720" fill="#faf8f5"/>
  <text x="32" y="32" font-size="18" font-weight="700" fill="#111">Booze Barometer - Arduino Nano board</text>
  <text x="32" y="52" font-size="11" fill="#555">Matches firmware pinout | FRONT/BACK = WS2812 | inputs active LOW to GND</text>

  <!-- Nano -->
  <rect x="300" y="80" width="220" height="420" rx="6" fill="#222" stroke="#000" stroke-width="2"/>
  <text x="410" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#eee">Arduino Nano</text>
  <text x="410" y="126" text-anchor="middle" font-size="10" fill="#888">U1</text>

  <g font-size="11" fill="#eee">
    <text x="315" y="165">D2 FRONT</text>
    <text x="315" y="200">D3 BACK</text>
    <text x="315" y="235">D4 ATTRACT</text>
    <text x="315" y="270">D5 GAME</text>
    <text x="315" y="305">D6 RELAY</text>
    <text x="315" y="340">D7 SPARE</text>
    <text x="315" y="390">A0 COIN</text>
    <text x="315" y="425">A1 START</text>
    <text x="315" y="460">A2 FAIL</text>
    <text x="315" y="495">A3 WIN</text>
  </g>

  <circle cx="300" cy="161" r="4" fill="#6cf"/>
  <circle cx="300" cy="196" r="4" fill="#6cf"/>
  <circle cx="520" cy="231" r="4" fill="#6f6"/>
  <circle cx="520" cy="266" r="4" fill="#6f6"/>
  <circle cx="520" cy="301" r="4" fill="#fa6"/>
  <circle cx="520" cy="336" r="4" fill="#aaa"/>
  <circle cx="300" cy="386" r="4" fill="#fc6"/>
  <circle cx="300" cy="421" r="4" fill="#fc6"/>
  <circle cx="300" cy="456" r="4" fill="#f66"/>
  <circle cx="300" cy="491" r="4" fill="#6f6"/>

  <!-- XH connectors FRONT BACK RELAY SPARE -->
  <g font-size="11">
    <rect x="40" y="90" width="120" height="70" rx="4" fill="#fff" stroke="#333"/>
    <text x="100" y="112" text-anchor="middle" font-weight="700" fill="#111">FRONT</text>
    <text x="100" y="130" text-anchor="middle" fill="#555">XH 1=GND</text>
    <text x="100" y="146" text-anchor="middle" fill="#555">2=D2 data</text>
    <text x="52" y="70" fill="#333">WS2812 strip</text>
    <line x1="160" y1="125" x2="300" y2="161" stroke="#333" stroke-width="1.5"/>

    <rect x="40" y="180" width="120" height="70" rx="4" fill="#fff" stroke="#333"/>
    <text x="100" y="202" text-anchor="middle" font-weight="700" fill="#111">BACK</text>
    <text x="100" y="220" text-anchor="middle" fill="#555">XH 1=GND</text>
    <text x="100" y="236" text-anchor="middle" fill="#555">2=D3 data</text>
    <text x="52" y="170" fill="#333">WS2812 strip</text>
    <line x1="160" y1="215" x2="300" y2="196" stroke="#333" stroke-width="1.5"/>

    <rect x="620" y="90" width="120" height="70" rx="4" fill="#fff" stroke="#333"/>
    <text x="680" y="112" text-anchor="middle" font-weight="700" fill="#111">RELAY</text>
    <text x="680" y="130" text-anchor="middle" fill="#555">XH module</text>
    <text x="680" y="146" text-anchor="middle" fill="#555">2=D6</text>
    <line x1="520" y1="301" x2="620" y2="125" stroke="#333" stroke-width="1.5"/>

    <rect x="620" y="180" width="120" height="70" rx="4" fill="#fff" stroke="#333"/>
    <text x="680" y="202" text-anchor="middle" font-weight="700" fill="#111">SPARE</text>
    <text x="680" y="220" text-anchor="middle" fill="#555">XH 2=D7</text>
    <line x1="520" y1="336" x2="620" y2="215" stroke="#333" stroke-width="1.5"/>
  </g>

  <!-- Board LEDs -->
  <rect x="620" y="280" width="280" height="130" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="640" y="304" font-size="12" font-weight="700" fill="#111">Board LEDs (1k series)</text>
  <text x="640" y="328" font-size="11" fill="#2a7">POWER  - 5V (always on)</text>
  <text x="640" y="350" font-size="11" fill="#36c">ATTRACT - D4</text>
  <text x="640" y="372" font-size="11" fill="#36c">GAME    - D5</text>
  <text x="640" y="396" font-size="10" fill="#555">LED cathode to GND</text>
  <line x1="520" y1="231" x2="620" y2="345" stroke="#36c" stroke-width="1.5"/>
  <line x1="520" y1="266" x2="620" y2="365" stroke="#36c" stroke-width="1.5"/>

  <!-- J1 inputs -->
  <rect x="40" y="320" width="220" height="220" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="150" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#111">J1 inputs (XH-5)</text>
  <text x="60" y="368" font-size="11" fill="#555">1 GND</text>
  <text x="60" y="392" font-size="11" fill="#111">2 Start  -&gt; A1</text>
  <text x="60" y="416" font-size="11" fill="#111">3 Fail   -&gt; A2</text>
  <text x="60" y="440" font-size="11" fill="#111">4 Win    -&gt; A3</text>
  <text x="60" y="464" font-size="11" fill="#111">5 Coin   -&gt; A0</text>
  <text x="60" y="496" font-size="10" fill="#555">100nF each signal to GND</text>
  <text x="60" y="514" font-size="10" fill="#555">Switches NO to GND</text>
  <text x="60" y="532" font-size="10" fill="#555">INPUT_PULLUP in firmware</text>

  <line x1="260" y1="386" x2="300" y2="421" stroke="#333" stroke-width="1.5"/>
  <line x1="260" y1="410" x2="300" y2="456" stroke="#333" stroke-width="1.5"/>
  <line x1="260" y1="434" x2="300" y2="491" stroke="#333" stroke-width="1.5"/>
  <line x1="260" y1="458" x2="300" y2="386" stroke="#333" stroke-width="1.5"/>

  <!-- Notes -->
  <rect x="40" y="580" width="880" height="110" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="56" y="606" font-size="12" font-weight="700" fill="#111">Notes</text>
  <text x="56" y="628" font-size="11" fill="#333">1. FRONT/BACK pin 2 is WS2812 data; power strips from a solid 5V supply (not only Nano 5V if long).</text>
  <text x="56" y="648" font-size="11" fill="#333">2. RELAY header must feed a relay module (transistor + diode), not a bare coil.</text>
  <text x="56" y="668" font-size="11" fill="#333">3. Fail = wire/ring sense. Win = end-of-path switch.</text>
</svg>
