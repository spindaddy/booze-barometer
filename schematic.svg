<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="920" height="700" fill="#f7f4ef"/>
  <text x="40" y="36" font-size="18" font-weight="700" fill="#1a1a1a">Booze Barometer - Arduino Nano Schematic</text>
  <text x="40" y="56" font-size="11" fill="#555">All switches: NO to GND | INPUT_PULLUP on Nano | shared GND required</text>

  <!-- Nano body -->
  <rect x="360" y="100" width="200" height="480" rx="8" fill="#2b2b2b" stroke="#111" stroke-width="2"/>
  <text x="460" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f0f0">Arduino Nano</text>
  <text x="460" y="150" text-anchor="middle" font-size="10" fill="#aaa">5V logic</text>

  <!-- Left pins -->
  <g font-size="11" fill="#f0f0f0">
    <text x="375" y="190">D2</text>
    <text x="375" y="250">D3</text>
    <text x="375" y="310">D4</text>
    <text x="375" y="370">D8</text>
    <text x="375" y="430">GND</text>
    <text x="375" y="490">VIN</text>
  </g>
  <!-- Right pins -->
  <g font-size="11" fill="#f0f0f0">
    <text x="525" y="190">D5</text>
    <text x="525" y="250">D6</text>
    <text x="525" y="310">D9</text>
    <text x="525" y="370">D13</text>
    <text x="525" y="430">5V</text>
    <text x="525" y="490">GND</text>
  </g>

  <!-- Pin dots left -->
  <circle cx="360" cy="186" r="4" fill="#6cf"/>
  <circle cx="360" cy="246" r="4" fill="#6cf"/>
  <circle cx="360" cy="306" r="4" fill="#6cf"/>
  <circle cx="360" cy="366" r="4" fill="#6cf"/>
  <circle cx="360" cy="426" r="4" fill="#fa6"/>
  <circle cx="360" cy="486" r="4" fill="#f66"/>

  <!-- Pin dots right -->
  <circle cx="560" cy="186" r="4" fill="#6f6"/>
  <circle cx="560" cy="246" r="4" fill="#6f6"/>
  <circle cx="560" cy="306" r="4" fill="#6f6"/>
  <circle cx="560" cy="366" r="4" fill="#6f6"/>
  <circle cx="560" cy="426" r="4" fill="#f66"/>
  <circle cx="560" cy="486" r="4" fill="#fa6"/>

  <!-- ===== LEFT: INPUTS ===== -->
  <!-- Start switch D2 -->
  <line x1="360" y1="186" x2="280" y2="186" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="186" x2="280" y2="160" stroke="#333" stroke-width="2"/>
  <circle cx="280" cy="150" r="8" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="272" y1="150" x2="240" y2="130" stroke="#333" stroke-width="2"/>
  <circle cx="240" cy="130" r="3" fill="#333"/>
  <line x1="240" y1="130" x2="240" y2="210" stroke="#333" stroke-width="2"/>
  <line x1="240" y1="210" x2="200" y2="210" stroke="#333" stroke-width="2"/>
  <text x="40" y="134" font-size="12" font-weight="700" fill="#1a1a1a">START SW</text>
  <text x="40" y="150" font-size="10" fill="#555">D2 | NO to GND</text>
  <rect x="40" y="160" width="90" height="36" rx="4" fill="#fff" stroke="#888"/>
  <text x="85" y="182" text-anchor="middle" font-size="11" fill="#333">Start</text>

  <!-- Wire contact D3 -->
  <line x1="360" y1="246" x2="200" y2="246" stroke="#333" stroke-width="2"/>
  <text x="40" y="230" font-size="12" font-weight="700" fill="#1a1a1a">WIRE SENSE</text>
  <text x="40" y="246" font-size="10" fill="#555">D3 | rod to pin</text>
  <path d="M200 246 C220 230 240 260 260 246 C280 232 300 260 320 246" fill="none" stroke="#c45" stroke-width="3"/>
  <circle cx="170" cy="270" r="12" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="158" y1="270" x2="120" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="270" x2="120" y2="210" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="210" x2="200" y2="210" stroke="#333" stroke-width="2"/>
  <text x="40" y="274" font-size="10" fill="#555">ring / handle to GND</text>
  <text x="200" y="268" font-size="9" fill="#c45">bent rod</text>

  <!-- End switch D4 -->
  <line x1="360" y1="306" x2="280" y2="306" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="306" x2="280" y2="330" stroke="#333" stroke-width="2"/>
  <circle cx="280" cy="340" r="8" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="272" y1="340" x2="240" y2="360" stroke="#333" stroke-width="2"/>
  <circle cx="240" cy="360" r="3" fill="#333"/>
  <line x1="240" y1="360" x2="240" y2="210" stroke="#333" stroke-width="2"/>
  <text x="40" y="320" font-size="12" font-weight="700" fill="#1a1a1a">END SW</text>
  <text x="40" y="336" font-size="10" fill="#555">D4 | NO to GND</text>
  <rect x="40" y="348" width="90" height="36" rx="4" fill="#fff" stroke="#888"/>
  <text x="85" y="370" text-anchor="middle" font-size="11" fill="#333">End / Win</text>

  <!-- Coin switch D8 -->
  <line x1="360" y1="366" x2="200" y2="366" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="366" x2="200" y2="400" stroke="#333" stroke-width="2"/>
  <circle cx="200" cy="410" r="8" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="192" y1="410" x2="160" y2="430" stroke="#333" stroke-width="2"/>
  <circle cx="160" cy="430" r="3" fill="#333"/>
  <line x1="160" y1="430" x2="160" y2="210" stroke="#333" stroke-width="2"/>
  <text x="40" y="400" font-size="12" font-weight="700" fill="#1a1a1a">COIN SW</text>
  <text x="40" y="416" font-size="10" fill="#555">D8 | NO to GND</text>
  <rect x="40" y="428" width="90" height="36" rx="4" fill="#fff" stroke="#888"/>
  <text x="85" y="450" text-anchor="middle" font-size="11" fill="#333">Coin</text>

  <!-- GND rail label left -->
  <line x1="120" y1="210" x2="280" y2="210" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="210" x2="360" y2="426" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="290" y="220" font-size="10" fill="#555">GND rail</text>

  <!-- VIN -->
  <line x1="360" y1="486" x2="280" y2="486" stroke="#c33" stroke-width="2"/>
  <rect x="160" y="470" width="120" height="40" rx="4" fill="#fff" stroke="#c33" stroke-width="2"/>
  <text x="220" y="494" text-anchor="middle" font-size="11" font-weight="700" fill="#c33">7-12V DC</text>
  <text x="160" y="528" font-size="10" fill="#555">or use USB 5V only (skip VIN)</text>

  <!-- ===== RIGHT: OUTPUTS ===== -->
  <!-- Buzzer D5 -->
  <line x1="560" y1="186" x2="640" y2="186" stroke="#333" stroke-width="2"/>
  <rect x="640" y="166" width="70" height="40" rx="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="675" y="190" text-anchor="middle" font-size="11" fill="#333">BZ</text>
  <line x1="710" y1="186" x2="760" y2="186" stroke="#333" stroke-width="2"/>
  <line x1="760" y1="186" x2="760" y2="486" stroke="#333" stroke-width="2"/>
  <text x="780" y="180" font-size="12" font-weight="700" fill="#1a1a1a">BUZZER</text>
  <text x="780" y="196" font-size="10" fill="#555">D5 | piezo + to pin</text>
  <text x="780" y="210" font-size="10" fill="#555">piezo - to GND</text>

  <!-- Lights direct from D6 -->
  <line x1="560" y1="246" x2="640" y2="246" stroke="#333" stroke-width="2"/>
  <rect x="655" y="220" width="50" height="20" rx="2" fill="#fff" stroke="#888"/>
  <text x="680" y="234" text-anchor="middle" font-size="10" fill="#333">220R</text>
  <line x1="640" y1="246" x2="655" y2="246" stroke="#333" stroke-width="2"/>
  <line x1="705" y1="246" x2="730" y2="246" stroke="#333" stroke-width="2"/>
  <!-- LED -->
  <line x1="720" y1="236" x2="740" y2="236" stroke="#333" stroke-width="2"/>
  <line x1="725" y1="246" x2="735" y2="246" stroke="#e90" stroke-width="3"/>
  <line x1="730" y1="246" x2="730" y2="266" stroke="#333" stroke-width="2"/>
  <line x1="720" y1="266" x2="740" y2="266" stroke="#333" stroke-width="2"/>
  <line x1="730" y1="266" x2="730" y2="486" stroke="#333" stroke-width="2"/>
  <text x="760" y="248" font-size="12" font-weight="700" fill="#1a1a1a">LIGHTS</text>
  <text x="760" y="264" font-size="10" fill="#555">D6 - R - LED - GND</text>
  <text x="760" y="278" font-size="10" fill="#555">1 LED (or 2 max)</text>
  <text x="760" y="292" font-size="10" fill="#555">keep under ~20 mA</text>

  <!-- Win LED D9 -->
  <line x1="560" y1="306" x2="640" y2="306" stroke="#333" stroke-width="2"/>
  <rect x="655" y="280" width="50" height="20" rx="2" fill="#fff" stroke="#888"/>
  <text x="680" y="294" text-anchor="middle" font-size="10" fill="#333">220R</text>
  <line x1="640" y1="306" x2="655" y2="306" stroke="#333" stroke-width="2"/>
  <line x1="705" y1="306" x2="730" y2="306" stroke="#333" stroke-width="2"/>
  <line x1="720" y1="296" x2="740" y2="296" stroke="#333" stroke-width="2"/>
  <line x1="725" y1="306" x2="735" y2="306" stroke="#2a8" stroke-width="3"/>
  <line x1="730" y1="306" x2="730" y2="326" stroke="#333" stroke-width="2"/>
  <line x1="720" y1="326" x2="740" y2="326" stroke="#333" stroke-width="2"/>
  <line x1="730" y1="326" x2="730" y2="486" stroke="#333" stroke-width="2"/>
  <text x="760" y="318" font-size="12" font-weight="700" fill="#1a1a1a">WIN LED</text>
  <text x="760" y="334" font-size="10" fill="#555">D9 | optional</text>

  <!-- D13 note -->
  <text x="580" y="390" font-size="10" fill="#aaa">D13 = onboard LED</text>

  <!-- GND bus right -->
  <line x1="640" y1="486" x2="760" y2="486" stroke="#333" stroke-width="2"/>
  <text x="700" y="510" font-size="11" font-weight="700" fill="#333">GND</text>

  <!-- Legend -->
  <rect x="40" y="550" width="840" height="120" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="56" y="574" font-size="12" font-weight="700" fill="#1a1a1a">Notes</text>
  <text x="56" y="596" font-size="11" fill="#333">1. Configure D2, D3, D4, D8 as INPUT_PULLUP. Switches/wire close to GND (active LOW).</text>
  <text x="56" y="614" font-size="11" fill="#333">2. Wire path is 5V logic only - do not put battery voltage on the rod/ring.</text>
  <text x="56" y="632" font-size="11" fill="#333">3. LEDs drive directly from Nano pins via ~220 ohm. Stay under ~20 mA per pin.</text>
  <text x="56" y="650" font-size="11" fill="#333">4. Small piezo on D5 direct. Loud 12V bell would need a driver (omitted).</text>
</svg>
