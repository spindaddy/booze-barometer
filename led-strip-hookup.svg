<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #111; }
      .sub { font-size: 13px; fill: #555; }
      .label { font-size: 12px; font-weight: 650; fill: #222; }
      .small { font-size: 11px; fill: #444; }
      .tiny { font-size: 10px; fill: #666; }
      .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; fill: #222; }
      .wire5v { stroke: #c62828; stroke-width: 2.5; fill: none; }
      .wireGnd { stroke: #222; stroke-width: 2.5; fill: none; }
      .wireData { stroke: #1565c0; stroke-width: 2.2; fill: none; }
      .box { fill: #f7f7f8; stroke: #333; stroke-width: 1.5; rx: 10; }
      .hdr { fill: #fff8e7; stroke: #b8860b; stroke-width: 1.2; rx: 4; }
      .note { fill: #fff3e0; stroke: #ef6c00; stroke-width: 1; rx: 8; }
    </style>
  </defs>

  <rect width="1100" height="780" fill="#fafafa"/>
  <text x="40" y="36" class="title">Booze Barometer  LED strip hookup map</text>
  <text x="40" y="58" class="sub">WS2812 / NeoPixel ∑ 5 V ∑ common ground ∑ data through on-board 330 ©</text>

  <!-- Board -->
  <rect x="40" y="90" width="220" height="320" class="box"/>
  <text x="55" y="118" class="label">Control board (Nano)</text>
  <text x="55" y="140" class="tiny">Schematic pin names</text>

  <rect x="55" y="155" width="190" height="48" fill="#e3f2fd" stroke="#1565c0" rx="6"/>
  <text x="68" y="175" class="label">FRONT header</text>
  <text x="68" y="193" class="mono">DATA = D2  (+5V, GND)</text>

  <rect x="55" y="215" width="190" height="48" fill="#e8f5e9" stroke="#2e7d32" rx="6"/>
  <text x="68" y="235" class="label">BACK header</text>
  <text x="68" y="253" class="mono">DATA = D3  (+5V, GND)</text>

  <rect x="55" y="275" width="190" height="48" fill="#fff8e1" stroke="#f9a825" rx="6"/>
  <text x="68" y="295" class="label">SPARE í HEADER</text>
  <text x="68" y="313" class="mono">DATA = D7  (+5V, GND)</text>

  <rect x="55" y="340" width="190" height="50" class="note"/>
  <text x="65" y="360" class="small">Firmware default:</text>
  <text x="65" y="378" class="mono">SWAP_FRONT_BACK = 1</text>
  <text x="65" y="392" class="tiny">(logical FRONT on D3, BACK on D2)</text>

  <!-- Power rail note -->
  <rect x="40" y="430" width="220" height="100" class="note"/>
  <text x="55" y="455" class="label">Power (important)</text>
  <text x="55" y="475" class="small">Feed strips from a solid 5 V supply</text>
  <text x="55" y="493" class="small">sized for all LEDs + relay.</text>
  <text x="55" y="511" class="small">Tie strip GND to board GND.</text>

  <!-- Legend -->
  <rect x="40" y="550" width="220" height="90" class="box"/>
  <text x="55" y="575" class="label">Wire colors (typical)</text>
  <line x1="55" y1="595" x2="95" y2="595" class="wire5v"/>
  <text x="105" y="599" class="small">+5 V</text>
  <line x1="55" y1="615" x2="95" y2="615" class="wireGnd"/>
  <text x="105" y="619" class="small">GND</text>
  <line x1="150" y1="595" x2="190" y2="595" class="wireData"/>
  <text x="200" y="599" class="small">DATA</text>

  <!-- FRONT strip -->
  <rect x="320" y="90" width="740" height="100" class="box"/>
  <text x="340" y="118" class="label">FRONT strip ∑ 30 ◊ WS2812</text>
  <text x="340" y="138" class="mono">DIN ê board FRONT (schematic D2)</text>
  <!-- Front LED row -->
  <g transform="translate(340,152)">
    <rect x="0" y="0" width="16" height="16" fill="#ff8a1a" stroke="#333" rx="2"/>
    <text x="0" y="32" class="tiny">0</text>
    <rect x="22" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <rect x="44" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <rect x="66" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <rect x="88" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <text x="110" y="13" class="tiny">&</text>
    <rect x="130" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <rect x="152" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <rect x="174" y="0" width="16" height="16" fill="#ff8a1a" stroke="#333" rx="2"/>
    <text x="174" y="32" class="tiny">29</text>
    <text x="210" y="13" class="small">arrow of travel: DIN í DOUT</text>
  </g>
  <text x="340" y="175" class="tiny"> </text>

  <!-- wires FRONT -->
  <path d="M260,179 C290,179 300,140 320,140" class="wireData" marker-end="url(#arrow)"/>
  <text x="268" y="165" class="tiny" fill="#1565c0">DATA</text>

  <!-- BACK strip -->
  <rect x="320" y="220" width="740" height="100" class="box"/>
  <text x="340" y="248" class="label">BACK strip ∑ 30 ◊ WS2812</text>
  <text x="340" y="268" class="mono">DIN ê board BACK (schematic D3)</text>
  <g transform="translate(340,282)">
    <rect x="0" y="0" width="16" height="16" fill="#ff8a1a" stroke="#333" rx="2"/>
    <text x="0" y="32" class="tiny">0</text>
    <rect x="22" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <rect x="44" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <rect x="66" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <rect x="88" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <text x="110" y="13" class="tiny">&</text>
    <rect x="130" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <rect x="152" y="0" width="16" height="16" fill="#ffb340" stroke="#333" rx="2"/>
    <rect x="174" y="0" width="16" height="16" fill="#ff8a1a" stroke="#333" rx="2"/>
    <text x="174" y="32" class="tiny">29</text>
    <text x="210" y="13" class="small">counts: NUM_FRONT / NUM_BACK in sketch</text>
  </g>
  <path d="M260,239 C290,239 300,270 320,270" class="wireData" marker-end="url(#arrow)"/>
  <text x="268" y="255" class="tiny" fill="#1565c0">DATA</text>

  <!-- HEADER -->
  <rect x="320" y="350" width="740" height="390" class="box"/>
  <text x="340" y="378" class="label">HEADER strip (Spare port) ∑ 38 ◊ WS2812 ∑ chain order from DIN</text>
  <text x="340" y="398" class="mono">DIN ê board SPARE / D7   ∑   pixel 0 is closest to the board</text>
  <path d="M260,299 C290,299 300,390 320,390" class="wireData" marker-end="url(#arrow)"/>
  <text x="268" y="340" class="tiny" fill="#1565c0">DATA</text>

  <!-- Section blocks -->
  <!-- widths proportional-ish: 11,12,5,2,5,1,1,1 H scale ~14px per LED for first few then compact -->
  <g transform="translate(340,420)">
    <!-- 1 Insert Token 11 -->
    <rect x="0" y="0" width="154" height="70" class="hdr"/>
    <text x="8" y="22" class="label">1. Insert Token</text>
    <text x="8" y="42" class="mono">11 LEDs</text>
    <text x="8" y="60" class="tiny">px 0  10</text>

    <!-- 2 Proceed 12 -->
    <rect x="164" y="0" width="168" height="70" class="hdr"/>
    <text x="172" y="22" class="label">2. Proceed to Start</text>
    <text x="172" y="42" class="mono">12 LEDs</text>
    <text x="172" y="60" class="tiny">px 11  22</text>

    <!-- 3 Go 5 -->
    <rect x="342" y="0" width="84" height="70" class="hdr"/>
    <text x="350" y="22" class="label">3. Go!</text>
    <text x="350" y="42" class="mono">5 LEDs</text>
    <text x="350" y="60" class="tiny">px 23  27</text>

    <!-- 4 Left 2 -->
    <rect x="436" y="0" width="56" height="70" class="hdr"/>
    <text x="444" y="22" class="label">4. Left</text>
    <text x="444" y="42" class="mono">2</text>
    <text x="444" y="60" class="tiny">2829</text>

    <!-- 5 Attempts 5 -->
    <rect x="502" y="0" width="84" height="70" class="hdr"/>
    <text x="510" y="22" class="label">5. Attempts</text>
    <text x="510" y="42" class="mono">5 LEDs</text>
    <text x="510" y="60" class="tiny">px 30  34</text>

    <!-- 6 1 -->
    <rect x="596" y="0" width="36" height="70" class="hdr"/>
    <text x="606" y="28" class="label">6</text>
    <text x="606" y="48" class="mono">1</text>
    <text x="600" y="64" class="tiny">35</text>

    <!-- 7 2 -->
    <rect x="640" y="0" width="36" height="70" class="hdr"/>
    <text x="650" y="28" class="label">7</text>
    <text x="650" y="48" class="mono">2</text>
    <text x="644" y="64" class="tiny">36</text>

    <!-- 8 3 -->
    <rect x="684" y="0" width="36" height="70" class="hdr"/>
    <text x="694" y="28" class="label">8</text>
    <text x="694" y="48" class="mono">3</text>
    <text x="688" y="64" class="tiny">37</text>
  </g>

  <text x="340" y="520" class="small">Chain direction í</text>
  <line x1="450" y1="515" x2="700" y2="515" class="wireData" marker-end="url(#arrow)"/>
  <text x="710" y="520" class="tiny">DOUT end (pixel 37)</text>

  <!-- Per-strip connector callout -->
  <rect x="340" y="545" width="700" height="170" fill="#f0f4ff" stroke="#1565c0" rx="8"/>
  <text x="360" y="575" class="label">Each strip connector (3 wires)</text>
  <text x="360" y="600" class="mono">1. +5V    to PSU +5 V (and/or board +5 V if short run)</text>
  <text x="360" y="622" class="mono">2. GND    common with board GND and PSU GND</text>
  <text x="360" y="644" class="mono">3. DIN    data from board header (through 330 © already on board)</text>
  <text x="360" y="675" class="small">Boot check: FRONT = red flash, BACK = orange flash, HEADER walks sections 1í8.</text>
  <text x="360" y="695" class="small">If FRONT/BACK look swapped in the cabinet, leave SWAP_FRONT_BACK=1 or set it to 0 in the sketch.</text>
</svg>
